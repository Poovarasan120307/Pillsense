<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PillSense - Understand your medicines</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root{
    --bg:#F2F7F8; --surface:#FFFFFF; --ink:#12303A; --muted:#4F6872; --line:#C9D9DE;
    --primary:#0E6B73; --primary-ink:#FFFFFF;
    --morning:#B87500; --morning-bg:#FFF3D6;
    --afternoon:#1F6FA8; --afternoon-bg:#DDEEFA;
    --night:#4B3F9E; --night-bg:#E8E5FA;
    --ok:#1B7A3E; --ok-bg:#DFF3E4;
    --bad:#B42318; --bad-bg:#FDE4E1;
    --warn:#9A3412; --warn-bg:#FFE9DD;
    --focus:#0B57D0;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1B20; --surface:#16272E; --ink:#E7F1F3; --muted:#9FB6BE; --line:#2C444D;
      --primary:#3FB6BF; --primary-ink:#06242A;
      --morning:#F2B84B; --morning-bg:#3A2D0B;
      --afternoon:#7FBDEB; --afternoon-bg:#12303F;
      --night:#B3A9F2; --night-bg:#26214B;
      --ok:#7BDC9B; --ok-bg:#12331F;
      --bad:#FF9E94; --bad-bg:#3E1713;
      --warn:#FFB38F; --warn-bg:#3D2113;
      --focus:#8AB4F8;
    }
  }
  *{box-sizing:border-box}
  html{font-size:18px}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;line-height:1.55}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  main{max-width:780px;margin:0 auto;padding:20px 16px 64px}
  header{padding:12px 0 8px}
  h1{font-size:2rem;margin:0;letter-spacing:-.01em}
  h1 span{color:var(--primary)}
  .tag{margin:2px 0 0;color:var(--muted)}
  h2{font-size:1.35rem;margin:0 0 10px}
  h3{font-size:1.1rem;margin:0}
  section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
  .lbl{display:block;font-weight:700;margin-bottom:6px}
  select,input[type=text],input[type=password]{
    font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:12px;width:100%}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1 1 220px}
  button{font:inherit;font-weight:700;border-radius:12px;padding:14px 18px;border:2px solid var(--primary);cursor:pointer;
    background:var(--surface);color:var(--primary);min-height:52px}
  button.primary{background:var(--primary);color:var(--primary-ink)}
  button.mode{min-height:68px;font-size:1.1rem}
  button:disabled{opacity:.55;cursor:not-allowed}
  .hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}
  details summary{cursor:pointer;font-weight:700}
  .status{margin-top:14px;padding:12px 14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
  .status.err{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
  .notice{background:var(--warn-bg);color:var(--warn);border-left:6px solid var(--warn);padding:12px 14px;border-radius:8px;margin:12px 0}
  .banner{font-size:.9rem;color:var(--muted);margin:0 0 8px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}

  /* Camera */
  .cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:70vh;margin:0 auto}
  @media (min-width:700px){.cam{aspect-ratio:4/3}}
  .cam video,.cam img{width:100%;height:100%;object-fit:cover;display:block}
  .frame{position:absolute;inset:8% 7.5%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none}
  .frame-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;
    padding:6px 14px;border-radius:999px;font-size:.9rem;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
  .camctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .camctl>*{flex:1}
  .shutter{flex:0 0 auto;width:78px;height:78px;border-radius:50%;padding:0;border:6px solid var(--primary);background:#fff;color:#000;font-size:.8rem;min-height:0}
  .shutter-wrap{flex:0 0 auto;text-align:center}
  .shutter-wrap small{display:block;color:var(--muted);margin-top:4px}

  /* Day plan */
  .day{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
  @media (max-width:640px){.day{grid-template-columns:1fr}}
  .band{border-radius:12px;padding:12px;border:2px solid currentColor;min-height:110px}
  .band h3{margin-bottom:8px}
  .band.morning{background:var(--morning-bg);color:var(--morning)}
  .band.afternoon{background:var(--afternoon-bg);color:var(--afternoon)}
  .band.night{background:var(--night-bg);color:var(--night)}
  .band ul{list-style:none;margin:0;padding:0;color:var(--ink)}
  .band li{padding:6px 0;border-top:1px solid color-mix(in srgb,currentColor 35%,transparent)}
  .band li:first-child{border-top:0}
  .band .none{color:var(--muted);font-style:italic}
  .food{display:block;font-size:.85rem;color:var(--muted)}

  .med{border-top:1px solid var(--line);padding:14px 0}
  .med:first-of-type{border-top:0}
  .med .strength{color:var(--muted);font-weight:400}
  .med p{margin:4px 0}
  .med ul{margin:6px 0 0 1.1rem;padding:0}
  .disc{font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);margin-top:14px;padding-top:12px}

  /* Tablet check result */
  .verdict{border:2px solid currentColor;border-radius:14px;padding:18px;margin:10px 0}
  .verdict h3{font-size:1.3rem;margin-bottom:6px}
  .verdict p{margin:4px 0;color:var(--ink)}
  .verdict.ok{color:var(--ok);background:var(--ok-bg)}
  .verdict.bad{color:var(--bad);background:var(--bad-bg)}
  .verdict.warn{color:var(--warn);background:var(--warn-bg)}
  .check{list-style:none;margin:8px 0 0;padding:0}
  .check li{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .check li:first-child{border-top:0}
  .tick{flex:0 0 28px;height:28px;border:2px solid var(--line);border-radius:50%;text-align:center;line-height:24px;font-weight:700}
  .tick.on{background:var(--ok);border-color:var(--ok);color:var(--surface)}
  footer{margin-top:22px;font-size:.85rem;color:var(--muted)}
  .visually-hidden{position:absolute;left:-9999px}
  [hidden]{display:none!important}
  @media print{ .noprint,header,footer,.actions{display:none!important} body{background:#fff;color:#000} }
  @media (prefers-reduced-motion: no-preference){ .spin{animation:spin 1s linear infinite;display:inline-block} @keyframes spin{to{transform:rotate(360deg)}} }
</style>
</head>
<body>
<main>
  <header>
    <h1>Pill<span>Sense</span></h1>
    <p class="tag" id="tagline"></p>
  </header>

  <section class="noprint">
    <label class="lbl" for="lang" id="lblLang"></label>
    <select id="lang">
      <option value="English">English</option>
      <option value="Hindi">हिन्दी (Hindi)</option>
      <option value="Kannada">ಕನ್ನಡ (Kannada)</option>
    </select>
    <div class="row" style="margin-top:14px">
      <button class="primary mode" id="modeRx" type="button"></button>
      <button class="mode" id="modeTab" type="button"></button>
    </div>
    <p class="hint" id="modeHint"></p>
  </section>

  <section class="noprint" id="capture" hidden aria-labelledby="capTitle">
    <h2 id="capTitle"></h2>
    <div id="camArea" hidden>
      <div class="cam">
        <video id="vid" autoplay playsinline muted></video>
        <div class="frame"></div>
        <div class="frame-hint" id="frameHint"></div>
      </div>
      <div class="camctl">
        <button id="galleryBtn" type="button"></button>
        <div class="shutter-wrap"><button class="shutter" id="shot" type="button" aria-label="Take photo"></button><small id="shotLbl"></small></div>
        <button id="flipBtn" type="button"></button>
      </div>
      <div class="actions"><button id="torchBtn" type="button" hidden></button><button id="closeCam" type="button"></button></div>
    </div>
    <div id="previewArea" hidden>
      <div class="cam"><img id="prevImg" alt="Your photo"></div>
      <div id="qualityMsg" class="notice" hidden></div>
      <div class="actions"><button class="primary" id="usePhoto" type="button"></button><button id="retake" type="button"></button></div>
    </div>
    <div id="startArea">
      <div class="row">
        <button class="primary mode" id="openCam" type="button"></button>
        <button class="mode" id="galleryBtn2" type="button"></button>
      </div>
    </div>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <canvas id="work" hidden></canvas>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
  </section>

  <section class="noprint">
    <details id="settings">
      <summary>Settings (needed once)</summary>
      <div style="margin-top:12px">
        <label class="lbl" for="key">Gemini API key</label>
        <input id="key" type="password" autocomplete="off" placeholder="Paste your key here">
        <p class="hint">Get a free key at aistudio.google.com/app/apikey. It stays in this browser only. Do not share this page with your key saved in it.</p>
        <label class="lbl" for="model" style="margin-top:12px">Model</label>
        <input id="model" type="text" value="gemini-2.5-flash">
        <p class="hint">If you see "model not found", type another current Gemini Flash model name.</p>
      </div>
    </details>
    <button id="sample" type="button" style="margin-top:12px">Try the offline sample</button>
  </section>

  <section id="result" aria-live="polite" hidden></section>

  <footer id="foot"></footer>
</main>

  // simple brightness + blur check on a small grayscale copy
  function quality(canvas){
    var t = T(), sw = 320, sh = Math.max(1, Math.round(canvas.height * sw / canvas.width));
    var s = document.createElement("canvas"); s.width = sw; s.height = sh;
    var sx = s.getContext("2d"); sx.drawImage(canvas, 0, 0, sw, sh);
    var d = sx.getImageData(0, 0, sw, sh).data, g = new Float32Array(sw * sh), sum = 0, i, x, y;
    for (i = 0; i < sw * sh; i++){ g[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]; sum += g[i]; }
    var mean = sum / (sw * sh), lsum = 0, lsq = 0, n = 0;
    for (y = 1; y < sh - 1; y++) for (x = 1; x < sw - 1; x++){
      var k = y*sw + x, lap = 4*g[k] - g[k-1] - g[k+1] - g[k-sw] - g[k+sw];
      lsum += lap; lsq += lap*lap; n++;
    }
    var variance = lsq/n - (lsum/n)*(lsum/n), msg = "";
    if (mean < 55) msg = t.tooDark; else if (variance < 25) msg = t.tooBlur;
    $("prevImg").src = imageData.dataUrl;
    var q = $("qualityMsg"); q.hidden = !msg; q.textContent = msg;
    $("usePhoto").textContent = msg ? t.useAnyway : t.useThis;
    $("usePhoto").className = msg ? "" : "primary"; $("retake").className = msg ? "primary" : "";
    showArea("prev"); hideStatus();
  }

  function promptRx(lang){
    return [
      "You help elderly patients in India understand a doctor's prescription from a photo.",
      "Read ONLY what is actually written. If a word, dose or timing is not clearly legible, do NOT guess: add it to unclear_items instead.",
      "If the image is not a prescription or is unreadable, return an empty medicines list and put a short reason in unclear_items.",
      "Write all explanations in " + lang + " using very simple words suitable for an elderly person. Keep medicine names in English letters exactly as written.",
      "For each medicine give: name, strength (as written, or empty), purpose (one short plain sentence about what this kind of medicine is generally for), food (one of: before food, after food, with food, any time, unclear),",
      "morning, afternoon, night (the dose to take then, such as '1 tablet', or empty string if none; convert patterns like 1-0-1 or BD/OD/TDS/HS), duration (as written, or empty), precautions (0-3 short, general, widely known safety notes; do not invent doses).",
      "interaction_notes: only general concerns widely known between the listed medicines, phrased as something to ask the pharmacist or doctor. Empty list if none.",
      "confidence: high, medium or low for how well you could read the prescription.",
      "Never advise starting, stopping or changing a medicine. Never diagnose.",
      "Reply with JSON only, matching this shape exactly:",
      '{"medicines":[{"name":"","strength":"","purpose":"","food":"","morning":"","afternoon":"","night":"","duration":"","precautions":[""]}],"interaction_notes":[""],"unclear_items":[""],"confidence":"high|medium|low"}'

  }

      "precautions (0-3 short, widely known safety notes in " + lang + "), unclear_items (anything printed but not legible).",

  /* ---------- AI call ---------- */
  function callGemini(prompt){
    var key = $("key").value.trim(), model = $("model").value.trim() || "gemini-2.5-flash";
    var url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent?key=" + encodeURIComponent(key);
    var body = { contents:[{ parts:[{ text:prompt }, { inline_data:{ mime_type:imageData.mime, data:imageData.b64 } }] }],
                 generationConfig:{ temperature:0.1, responseMimeType:"application/json" } };
    var ctrl = ("AbortController" in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 30000);
    return fetch(url, { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
      .then(function(res){
        clearTimeout(timer);
        if (!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || "Request failed.");
        var c = res.j.candidates && res.j.candidates[0];
        var txt = c && c.content && c.content.parts && c.content.parts.map(function(p){ return p.text || ""; }).join("");
        if (!txt) throw new Error("The AI returned no answer. Please try a clearer photo.");
        try{ return JSON.parse(txt.replace(/```json|```/g, "").trim()); }catch(e){ throw new Error("The answer could not be read. Please try again."); }
      })
      .catch(function(e){ clearTimeout(timer); if (e.name === "AbortError") throw new Error("It took too long. Please try again."); throw e; });
  }

      })
      .catch(function(err){ status("Something went wrong: " + err.message, true); })
      .then(function(){ $("usePhoto").disabled = false; });
  }

    if (inter.length) box.appendChild(h("div", {"class":"notice"}, h("strong", null, t.ask + ": "), inter.join(" ")));
    var un = arr(data.unclear_items);
    if (un.length){ var u = h("ul"); un.forEach(function(x){ u.appendChild(h("li", null, x)); }); box.appendChild(h("div", {"class":"notice"}, h("strong", null, t.unclear), u)); }
    var actions = h("div", {"class":"actions"});
    var rb = h("button", {type:"button", "class":"primary"}, t.read); rb.onclick = function(){ speak(spokenText(meds, t)); };
    var pb = h("button", {type:"button"}, t.print); pb.onclick = function(){ window.print(); };
    var cb = h("button", {type:"button"}, t.scanTab); cb.onclick = function(){ setMode("tab"); };
    actions.appendChild(rb); actions.appendChild(pb); actions.appendChild(cb);
    box.appendChild(actions); box.appendChild(disclaimer(t)); finishResult(box);
  }
  function spokenText(meds, t){
    var parts = [];
    ["morning","afternoon","night"].forEach(function(slot){
      var items = []; meds.forEach(function(m){ var d = str(m[slot]); if (d) items.push(str(m.name) + " " + d); });
      if (items.length) parts.push(t[slot] + ": " + items.join(", "));
    });
    return parts.join(". ") + ". " + t.disc;
  }
  function speak(text){
    if (!("speechSynthesis" in window)){ status("Reading aloud is not supported in this browser.", true); return; }
    var want = SPEECH[lastLang] || "en-IN", voices = window.speechSynthesis.getVoices() || [];
    if (voices.length && !voices.some(function(v){ return v.lang && v.lang.replace("_","-").toLowerCase().indexOf(want.slice(0,2)) === 0; })){
      status("Voice not available on this device for " + lastLang + ".", true); return;
    }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text); u.lang = want; u.rate = 0.9; window.speechSynthesis.speak(u);
  }
  function finishResult(box){
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    box.scrollIntoView({behavior: reduce ? "auto" : "smooth", block:"start"});
  }

  /* ---------- matching (cover vs prescription) ---------- */
  function norm(s){ return str(s).toLowerCase().replace(/\b(tablets?|tabs?|caps?|capsules?|ip|bp|usp|sr|xr|er|forte)\b/g, " ").replace(/[^a-z]/g, ""); }
  function strengthOf(s){ var m = str(s).toLowerCase().replace(/\s+/g, "").match(/(\d+(?:\.\d+)?)(mcg|mg|g|ml|iu)/); return m ? m[1] + m[2] : ""; }
  function findMatch(name){
    if (!rxData) return -1; var a = norm(name); if (a.length < 3) return -1;
    for (var i = 0; i < rxData.meds.length; i++){
      var b = norm(rxData.meds[i].name); if (b.length < 3) continue;
      if (a === b || (a.length >= 4 && b.indexOf(a) !== -1) || (b.length >= 4 && a.indexOf(b) !== -1)) return i;
    }
    return -1;
  }

  /* ---------- render: tablet cover ---------- */
  function renderTab(data, lang){
    var t = UI[lang] || UI.English, box = $("result"); box.hidden = false; box.textContent = ""; lastLang = lang;
    var readable = data && data.readable !== false && str(data.name);
    var tablet = readable ? data : null;

    if (rxData){ box.appendChild(h("h2", null, t.checklist)); box.appendChild(checklist(t)); }

    if (!tablet){
      box.appendChild(h("div", {"class":"verdict warn"}, h("h3", null, t.tabNoLabel), h("p", null, t.tabNoLabelSub)));
      var un0 = arr(data && data.unclear_items); if (un0.length) box.appendChild(h("p", null, un0.join(" ")));
      tabActions(box, t); box.appendChild(disclaimer(t)); finishResult(box); return;
    }
    var name = str(tablet.name), strength = str(tablet.strength);
    var idx = findMatch(name), state, head, sub = [];
    if (!rxData){
      state = "warn"; head = name + (strength ? " " + strength : ""); sub.push(h("p", null, t.noRxMatchHint));
    } else if (idx < 0){
      state = "bad"; head = t.notOn; sub.push(h("p", null, name + (strength ? " " + strength : "")), h("p", null, h("strong", null, t.askBefore)));
    } else {
      var rm = rxData.meds[idx], a = strengthOf(strength), b = strengthOf(rm.strength);
      if (a && b && a !== b){
        state = "warn"; head = t.strengthDiff;
        sub.push(h("p", null, t.coverSays + ": " + strength), h("p", null, t.rxStrength + ": " + str(rm.strength)), h("p", null, h("strong", null, t.askBefore)));
      } else {
        state = "ok"; head = t.match; checked[idx] = true;
        sub.push(h("p", null, str(rm.name) + (str(rm.strength) ? " " + str(rm.strength) : "")));
      }
    }
    var verdict = h("div", {"class":"verdict " + state}, h("h3", null, head));
    sub.forEach(function(x){ verdict.appendChild(x); });
    box.appendChild(verdict);

    // what it is for
    var info = h("div", {"class":"med"}, h("h3", null, name, strength ? h("span", {"class":"strength"}, " " + strength) : null));
    if (str(tablet.purpose)) info.appendChild(h("p", null, h("strong", null, t.usedFor + ": "), str(tablet.purpose)));
    if (str(tablet.label_directions)) info.appendChild(h("p", null, h("strong", null, t.onLabel + ": "), str(tablet.label_directions)));
    var pc = arr(tablet.precautions); if (pc.length){ var ul = h("ul"); pc.forEach(function(p){ ul.appendChild(h("li", null, p)); }); info.appendChild(ul); }
    box.appendChild(info);

    // when to take: only from the prescription
    if (state === "ok"){
      var m = rxData.meds[idx];
      box.appendChild(h("h2", {style:"margin-top:16px"}, t.takeAt));
      box.appendChild(dayPlan([m], t));
    } else if (!rxData){
      box.appendChild(h("div", {"class":"notice"}, t.needRx));
    }
    tabActions(box, t); box.appendChild(disclaimer(t)); finishResult(box);
    if (rxData){ var cl = box.querySelector(".check"); if (cl) cl.replaceWith(checklist(t)); }
  }
  function checklist(t){
    var ul = h("ul", {"class":"check"});
    rxData.meds.forEach(function(m, i){
      var on = !!checked[i];
      ul.appendChild(h("li", null, h("span", {"class":"tick" + (on ? " on" : ""), "aria-hidden":"true"}, on ? "\u2713" : ""),
        h("span", null, str(m.name) + (str(m.strength) ? " " + str(m.strength) : "") + (on ? " \u2013 " + t.checkedWord : ""))));
    });
    return ul;
  }
  function tabActions(box, t){
    var a = h("div", {"class":"actions"});
    var s = h("button", {type:"button", "class":"primary"}, t.scanAnother); s.onclick = function(){ setMode("tab"); };
    var d = h("button", {type:"button"}, t.done); d.onclick = function(){ $("result").hidden = true; $("capture").hidden = true; window.scrollTo(0,0); };
    a.appendChild(s); a.appendChild(d); box.appendChild(a);
  }

  /* ---------- offline sample (labelled) ---------- */
  var SAMPLE = { medicines:[
    {name:"Metformin",strength:"500 mg",purpose:"Helps keep blood sugar under control.",food:"after food",morning:"1 tablet",afternoon:"",night:"1 tablet",precautions:["Take with or after meals to avoid stomach upset."]},
    {name:"Aspirin",strength:"75 mg",purpose:"Helps stop blood from forming clots.",food:"after food",morning:"",afternoon:"1 tablet",night:"",precautions:["Tell your doctor if you see black stools or unusual bleeding."]},
    {name:"Amlodipine",strength:"5 mg",purpose:"Helps keep blood pressure under control.",food:"any time",morning:"",afternoon:"",night:"1 tablet",precautions:["Do not stop it on your own. Ask your doctor first."]}],
    interaction_notes:["Ask your pharmacist to confirm these medicines are safe together for you."], unclear_items:[], confidence:"high" };
  $("sample").onclick = function(){ renderRx(SAMPLE, "English", true); hideStatus(); };

  applyLang();
  window.addEventListener("pagehide", stopCamera);
})();
</script>
</body>
